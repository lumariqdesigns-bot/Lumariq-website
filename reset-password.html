<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Lumariq — Reset Password</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:#0d0d0d;
font-family:Arial,Helvetica,sans-serif;
}

.card{

width:380px;
background:#171717;
padding:45px;
border-radius:14px;
box-shadow:0 20px 60px rgba(0,0,0,.5);

}

.logo{

font-size:38px;
font-family:'Cormorant Garamond',serif;
color:white;
text-align:center;
margin-bottom:10px;

}

.subtitle{

text-align:center;
color:#999;
margin-bottom:35px;
line-height:1.5;
font-size:14px;

}

input{

width:100%;
padding:15px;
margin-bottom:18px;
background:#262626;
border:none;
border-radius:8px;
color:white;
font-size:15px;

}

input:focus{

outline:none;
border:1px solid #b59d73;

}

button{

width:100%;
padding:15px;
background:#b59d73;
border:none;
border-radius:8px;
font-size:15px;
cursor:pointer;
font-weight:bold;
transition:.3s;

}

button:hover{

background:#cdb48a;

}

button:disabled{

opacity:.5;
cursor:not-allowed;

}

#error{

margin-top:18px;
text-align:center;
color:#ff6565;

}

#success{

margin-top:18px;
text-align:center;
color:#7fd99a;
line-height:1.5;

}

.back-link{

display:block;
text-align:center;
margin-top:18px;
color:#b59d73;
font-size:13px;
text-decoration:none;

}

.back-link:hover{

color:#cdb48a;
text-decoration:underline;

}

#formWrap.hidden{

display:none;

}

</style>

</head>

<body>

<div class="card">

<div class="logo">LUMARIQ</div>

<div class="subtitle" id="subtitle">

Enter a new password for your admin account.

</div>

<div id="formWrap">

<input
id="password"
type="password"
placeholder="New password">

<input
id="confirmPassword"
type="password"
placeholder="Confirm new password">

<button onclick="updatePassword()" id="updateBtn">

Set New Password

</button>

</div>

<div id="error"></div>
<div id="success"></div>

<a class="back-link" href="login.html">← Back to login</a>

</div>

<script>

let sessionReady = false;

/*
  Supabase sends the user back here with a recovery token in the URL.
  supabase-js v2 automatically detects this and fires an
  onAuthStateChange event of type PASSWORD_RECOVERY once the
  session is established from the URL fragment.
*/

db.auth.onAuthStateChange((event, session) => {

  if(event === "PASSWORD_RECOVERY"){
    sessionReady = true;
  }

});

/* Fallback: if a session already exists (e.g. page refreshed
   after the recovery event already fired), allow reset too. */
db.auth.getSession().then(({data}) => {

  if(data.session){
    sessionReady = true;
  } else {

    // No session and no recovery token — link is invalid/expired
    setTimeout(() => {

      if(!sessionReady){

        document.getElementById("formWrap").classList.add("hidden");
        document.getElementById("subtitle").textContent =
          "This reset link is invalid or has expired. Please request a new one.";

      }

    }, 2500);

  }

});

async function updatePassword(){

const password = document.getElementById("password").value;
const confirmPassword = document.getElementById("confirmPassword").value;

const errorEl = document.getElementById("error");
const successEl = document.getElementById("success");

errorEl.textContent = "";
successEl.textContent = "";

if(!password || password.length < 6){
  errorEl.textContent = "Password must be at least 6 characters.";
  return;
}

if(password !== confirmPassword){
  errorEl.textContent = "Passwords do not match.";
  return;
}

const btn = document.getElementById("updateBtn");
btn.disabled = true;
btn.textContent = "Updating…";

const { error } = await db.auth.updateUser({ password });

btn.disabled = false;
btn.textContent = "Set New Password";

if(error){
  errorEl.textContent = error.message;
  return;
}

document.getElementById("formWrap").classList.add("hidden");
successEl.textContent = "Password updated successfully. Redirecting to login…";

setTimeout(() => {
  db.auth.signOut().then(() => {
    location.href = "login.html";
  });
}, 1800);

}

</script>

</body>

</html>
